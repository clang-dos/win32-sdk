# Windows 95, 98, ME and NT 4.0 and later with picolibc as the
# C library: programs need no C runtime DLL (libc++ included)
--target=i386-pc-windows4.0-gnu
--sysroot=<CFGDIR>/../sysroots/win32-picolibc
-fuse-ld=lld
-stdlib=libc++
-fno-emulated-tls
-nostartfiles
-nodefaultlibs
$-lc++
$-lunwind
$-lc
$-lm
$-lclang_rt.builtins-i386
$-ladvapi32
$-lshell32
$-luser32
$-lkernel32
