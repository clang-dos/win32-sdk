# Windows NT 3.1, 3.5 and 3.51 (and every later 32-bit Windows) with
# picolibc as the C library: programs need no C runtime DLL (libc++ included)
--target=i386-pc-windows3.10-gnu
--sysroot=<CFGDIR>/../sysroots/win32-picolibc
-fuse-ld=lld
-stdlib=libc++
-fno-emulated-tls
-nostartfiles
-nodefaultlibs
$-lc++
$-lunwind
$-lc
$-lm
$-lclang_rt.builtins-i386
$-ladvapi32
$-lshell32
$-luser32
$-lkernel32
